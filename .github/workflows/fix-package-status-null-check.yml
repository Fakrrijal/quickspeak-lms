name: Fix package status null check

on:
  push:
    branches:
      - feature/level-completion-renewal

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch TypeScript null check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/student/StudentLearningPageV2.tsx')
          text = path.read_text()
          old = "const packageCompleted = Boolean(packageStatus?.current_package_session_count >= packageStatus.session_limit)"
          new = "const packageCompleted = Boolean(packageStatus && packageStatus.current_package_session_count >= packageStatus.session_limit)"
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- src/components/student/StudentLearningPageV2.tsx; then
            echo "No patch required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/student/StudentLearningPageV2.tsx
          git commit -m "fix: guard package status nullability"
          git push

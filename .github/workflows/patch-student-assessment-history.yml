name: Patch student assessment history

on:
  push:
    branches:
      - feature/level-completion-renewal
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch student learning page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/student/StudentLearningPageV2.tsx')
          text = path.read_text()

          old_import = "import { getMyStudentLearningProgress, type StudentLearningProgressRow } from '../../services/student-learning-progress.service'\n"
          new_import = old_import + "import { StudentLevelAssessmentHistory } from './StudentLevelAssessmentHistory'\n"
          if "StudentLevelAssessmentHistory" not in text:
              text = text.replace(old_import, new_import, 1)

          anchor = "      <section className=\"border border-slate-200 bg-white shadow-sm\" aria-labelledby=\"learning-materials-title\">"
          insert = "      <StudentLevelAssessmentHistory />\n\n" + anchor
          if "<StudentLevelAssessmentHistory />" not in text:
              if anchor not in text:
                  raise SystemExit('Learning materials anchor not found')
              text = text.replace(anchor, insert, 1)

          path.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- src/components/student/StudentLearningPageV2.tsx; then
            echo "No patch required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/student/StudentLearningPageV2.tsx
          git commit -m "feat: show student assessment history"
          git push
